name: Desktop release build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - desktop-release
    tags:
      - "v*"
    paths:
      - "backend/**"
      - "web/**"
      - "build_assets/**"
      - "build_scripts/**"
      - "desktop.py"
      - "requirements-desktop.txt"
      - ".github/workflows/windows-desktop-build.yml"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  APP_VERSION: "2.1.3"

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install desktop build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-desktop.txt

      - name: Run desktop unit tests
        run: python -m unittest -v tests.test_desktop

      - name: Build macOS application
        run: python build_scripts/build_desktop.py --macos --clean

      - name: Smoke-test and package macOS application
        shell: bash
        run: |
          set -euo pipefail
          app="公众号 AI Studio.app"
          executable="$app/Contents/MacOS/公众号 AI Studio"
          test -x "$executable"
          codesign --verify --deep --strict --verbose=2 "$app"

          smoke_dir="$(mktemp -d)"
          port="$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          STUDIO_DB="$smoke_dir/studio.db" \
          STUDIO_MASTER_KEY_FILE="$smoke_dir/.master.key" \
          STUDIO_LOG_FILE="$smoke_dir/studio.log" \
          STUDIO_PORT="$port" \
          "$executable" --server-only >"$smoke_dir/process.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          healthy=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$smoke_dir/process.log"
              exit 1
            fi
            if curl --noproxy '*' -fsS "http://127.0.0.1:$port/api/v2/health" | python -c 'import json,sys; assert json.load(sys.stdin)["ok"] is True'; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" -eq 1
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          trap - EXIT

          arch="$(uname -m)"
          asset="WeiXinGZH-AI-Studio-${APP_VERSION}-macOS-${arch}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$asset"
          shasum -a 256 "$asset" >"$asset.sha256"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: wechat-ai-studio-macos
          path: |
            WeiXinGZH-AI-Studio-*-macOS-*.zip
            WeiXinGZH-AI-Studio-*-macOS-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install desktop build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-desktop.txt

      - name: Run desktop unit tests
        run: python -m unittest -v tests.test_desktop

      - name: Build Windows package
        run: python build_scripts/build_desktop.py --windows --clean

      - name: Smoke-test packaged server
        shell: pwsh
        run: |
          $appDir = Join-Path $PWD "dist\公众号 AI Studio"
          $exe = Join-Path $appDir "公众号 AI Studio.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Missing packaged executable: $exe"
          }
          if (-not (Test-Path (Join-Path $appDir "_internal") -PathType Container)) {
            throw "Missing packaged dependency directory: _internal"
          }

          $smokeDir = Join-Path $env:RUNNER_TEMP "wechat-ai-studio-smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $smokeLog = Join-Path $smokeDir "studio.log"
          $env:STUDIO_DB = Join-Path $smokeDir "studio.db"
          $env:STUDIO_MASTER_KEY_FILE = Join-Path $smokeDir ".master.key"
          $env:STUDIO_LOG_FILE = $smokeLog

          $listener = [System.Net.Sockets.TcpListener]::new(
            [System.Net.IPAddress]::Loopback,
            0
          )
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $env:STUDIO_PORT = "$port"

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList "--server-only" `
            -WorkingDirectory $appDir `
            -PassThru
          $healthy = $false
          $failure = ""
          try {
            for ($attempt = 0; $attempt -lt 30 -and -not $healthy; $attempt++) {
              if ($process.HasExited) {
                $failure = "Packaged process exited early with code $($process.ExitCode)."
                break
              }
              try {
                $response = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:$port/api/v2/health" `
                  -NoProxy `
                  -TimeoutSec 2
                if ($response.ok -eq $true) {
                  $healthy = $true
                }
              } catch {
                $failure = $_.Exception.Message
              }
              if (-not $healthy) {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) {
              if (Test-Path $smokeLog -PathType Leaf) {
                Write-Host "=== Packaged application log ==="
                Get-Content $smokeLog -Tail 200
              }
              throw "Packaged application did not expose a healthy local server. $failure"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

          Get-FileHash -Algorithm SHA256 $exe |
            Format-List |
            Out-File -Encoding utf8 (Join-Path $appDir "SHA256.txt")

      - name: Package Windows application
        shell: pwsh
        run: |
          $asset = "WeiXinGZH-AI-Studio-$env:APP_VERSION-Windows-x64.zip"
          Compress-Archive -Path "dist\公众号 AI Studio\*" -DestinationPath $asset -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower() + "  " + $asset |
            Out-File -Encoding ascii -NoNewline "$asset.sha256"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: wechat-ai-studio-windows
          path: |
            WeiXinGZH-AI-Studio-*-Windows-x64.zip
            WeiXinGZH-AI-Studio-*-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v7
        with:
          pattern: wechat-ai-studio-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --latest
          fi
